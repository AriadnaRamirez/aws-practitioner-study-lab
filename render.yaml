# Render Blueprint: Nest API (free plan). Postgres lives on Neon; the web on Vercel.
services:
  - type: web
    name: aps-api
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build -w @aps/shared && npm run build -w @aps/backend
    startCommand: npm run prisma:migrate:deploy -w @aps/backend && npm run start:prod -w @aps/backend
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
        - packages/shared/**
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Vercel URL, e.g. https://aws-practitioner-study-lab.vercel.app
      - key: WEB_ORIGIN
        sync: false
